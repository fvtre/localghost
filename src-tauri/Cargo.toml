[package]
name = "localghost"
version = "0.1.0"
description = "Local-first meeting notes with native Windows audio capture"
authors = ["LocalGhost contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "localghost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
wasapi = "0.26"
